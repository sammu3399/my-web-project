<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Win | Discipline & Growth</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div id="login-screen" class="fullscreen-overlay">
        <div class="panel login-card">
            <h1>🏆 My Win</h1>
            <input type="text" id="username-input" placeholder="Enter Name...">
            <button id="login-btn" class="btn-glow">Start Winning</button>
        </div>
    </div>

    <div id="main-app" class="app-container hidden">
        <nav class="sidebar">
            <div class="brand">🏆 My Win</div>
            <ul class="nav-links">
                <li class="active">🏠 <span>Dash</span></li>
                <li>🧘 <span>Health</span></li>
                <li>📊 <span>Stats</span></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="profile-section">
                <div class="avatar-ring" id="settings-trigger" style="cursor: pointer;">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="profile-avatar">
                </div>
                <div>
                    <h2 id="display-name">User</h2>
                    <p>Level: Disciplined 🔥</p>
                </div>
            </header>

            <section class="mood-selector panel">
                <h3>How is your mood?</h3>
                <div class="mood-options">
                    <button onclick="setMood('😊')">😊</button>
                    <button onclick="setMood('🔥')">🔥</button>
                    <button onclick="setMood('😴')">😴</button>
                    <button onclick="setMood('🧘')">🧘</button>
                </div>
            </section>

            <div class="grid-layout">
                <div class="panel">
                    <h3>Daily Quests</h3>
                    <div id="task-list"></div>
                    <div class="input-group">
                        <input type="text" id="task-input" placeholder="e.g. Drink Water">
                        <button id="add-task-btn">+</button>
                    </div>
                </div>

                <div class="panel wellness-card">
                    <h3>Daily Wellness</h3>
                    <div id="yoga-box" class="hidden">
                        <div class="yoga-circle"></div>
                        <p>Focus on Breath</p>
                    </div>
                </div>
            </div>
            <button id="complete-day" class="btn-glow">Complete Day</button>
        </main>
    </div>

    <div id="guddu-overlay" class="fullscreen-overlay hidden">
        <div class="celebration-box">
            <span class="huge-emoji">🫂</span>
            <h2>Proud of you, Guddu bhai!</h2>
            <p>You conquered today like a true brother.</p>
            <button onclick="location.reload()">Finish</button>
        </div>
    </div>

    <div id="settings-modal" class="fullscreen-overlay hidden">
        <div class="panel login-card">
            <h2>Settings & Privacy</h2>
            <div style="margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); padding: 1rem; border-radius: 10px;">
                <span>Wellness Mode (Pink Mode)</span>
                <label class="switch">
                    <input type="checkbox" id="pcos-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <button id="close-settings" class="btn-glow" style="margin-top: 1.5rem; background: var(--blue);">Close</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
