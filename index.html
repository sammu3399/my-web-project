<div id="app">
    <nav class="sidebar">
        <div class="brand">My Win</div>
        <ul class="nav-links">
            <li onclick="showSection('dash')">🏠 <span>Dash</span></li>
            <li onclick="showSection('health')">🧘 <span>Health</span></li>
            <li onclick="showSection('stats')">📊 <span>Stats</span></li>
            <li onclick="showSection('social')">👥 <span>Social</span></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="panel hero-card">
            <div class="hero-content">
                <div class="profile-info">
                    <div class="avatar-holder">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="profile-avatar">
                    </div>
                    <div>
                        <h2 id="display-name">Guest User</h2>
                        <p>Level: <span id="user-level">Disciplined 🔥</span></p>
                    </div>
                </div>
                <div class="mood-container">
                    <p>How is your mood?</p>
                    <div class="mood-options">
                        <button onclick="setMood('😊')">😊</button>
                        <button onclick="setMood('🔥')">🔥</button>
                        <button onclick="setMood('😴')">😴</button>
                        <button onclick="setMood('🧘')">🧘</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="panel quest-section">
                <h3>Daily Quests</h3>
                <div id="task-list"></div>
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="e.g. Drink Water">
                    <button id="add-task-btn">+</button>
                </div>
                <button id="complete-day" class="btn-glow">Complete Day</button>
            </div>

            <div class="side-column">
                <div class="panel stat-card">
                    <span class="stat-label">🔥 Current Streak</span>
                    <h1 class="streak-val" id="streak-counter">0</h1>
                    <p>Days of Consistency</p>
                </div>

                <div class="panel wellness-card">
                    <h3>Wellness Hub</h3>
                    <div id="yoga-box" class="hidden">
                        <div class="yoga-circle"></div>
                        <p>Focus on Breath</p>
                    </div>
                    <div id="pcos-off-msg">
                        <p>Wellness Mode is Off</p>
                        <label class="switch">
                            <input type="checkbox" id="pcos-mode">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
