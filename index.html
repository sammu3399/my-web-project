<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Win - Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="main-content">

        <!-- Logout Button -->
        <button id="logout-btn" class="logout-btn">Logout</button>

        <!-- ================= HERO ================= -->
        <div class="panel hero-card">
            <div class="hero-content">

                <div class="profile-info">
                    <div class="avatar-box">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="profile-avatar">
                    </div>
                    <div>
                        <h2 id="display-name">Guest User</h2>
                        <p>Level: <span id="user-level">Disciplined 🔥</span></p>
                    </div>
                </div>

                <!-- Mood -->
                <div class="mood-container">
                    <p>How is your mood?</p>
                    <div class="mood-options">
                        <button onclick="setMood('😊')">😊</button>
                        <button onclick="setMood('🔥')">🔥</button>
                        <button onclick="setMood('😴')">😴</button>
                        <button onclick="setMood('🧘')">🧘</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ================= GRID ================= -->
        <div class="grid-layout">

            <!-- TASK SECTION -->
            <div class="panel quest-section">
                <h3>Daily Quests</h3>

                <div id="task-list"></div>

                <div class="input-group">
                    <input type="text" id="task-input" placeholder="e.g. Drink Water">
                    <button id="add-task-btn">+</button>
                </div>
            </div>

            <!-- SIDE COLUMN -->
            <div class="side-column">

                <!-- STREAK -->
                <div class="panel stat-card">
                    <h3>🔥 Streak</h3>
                    <h1 class="streak-val">0</h1>
                    <p>Days Consistent</p>

                    <!-- XP BAR -->
                    <div class="xp-bar">
                        <div class="xp-fill"></div>
                    </div>
                </div>

                <p class="xp-text">0 / 100 XP</p>
                <!-- WELLNESS -->
                <div class="panel wellness-card">
                    <h3>Wellness</h3>

                    <div id="yoga-box" class="hidden">
                        <div class="yoga-circle"></div>
                    </div>

                    <p id="pcos-off-msg">Enable Wellness in Settings</p>
                </div>

            </div>
        </div>

    </main>

    <!-- ================= JS ================= -->
    <script src="app.js"></script>

</body>

</html>
