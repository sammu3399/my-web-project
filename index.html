<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Win - Productivity</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="sidebar">
        <div class="brand">
            <h2>🏆 My Win</h2>
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#">🏠 Dashboard</a></li>
            <li><a href="#">🧘 Health</a></li>
            <li><a href="#">👥 Social</a></li>
        </ul>
    </nav>

    <main class="main-content">

        <header class="profile-section">
            <img src="your-avatar-url.jpg" id="user-avatar" class="profile-avatar" alt="Profile">
            <div>
                <h1 class="username">Guest User</h1>
                <p style="color: var(--text-dim);">Grinding everyday 🚀</p>
            </div>
        </header>

        <div class="grid-layout">

            <div class="tasks-module panel">
                <h3>Daily Quests</h3>
                <div id="task-list" class="task-list">
                </div>
                <div class="add-task-row">
                    <input type="text" id="task-input" placeholder="Add a task...">
                    <button id="add-task-btn">Add</button>
                </div>
            </div>

            <div class="stats-module">
                <div class="panel">
                    <h3>PCOD/PCOS Mode</h3>
                    <label class="switch">
                        <input type="checkbox" id="pcos-toggle">
                        <span class="slider"></span>
                    </label>
                    <div id="yoga-container" class="hidden">
                        <div class="yoga-circle"></div>
                        <p style="text-align:center; font-size: 0.8rem; margin-top:10px;">Deep Breathing Active</p>
                    </div>
                </div>

                <div class="panel">
                    <h3>🔥 Streak</h3>
                    <p id="streak-count">0 Days</p>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
