<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Win - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="panel login-panel">
            <div class="login-header">
                <h2>Set New Password</h2>
                <p>Choose a secure password ✨</p>
            </div>
            
            <form id="reset-form" class="login-form">
                <div class="input-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="login-btn" id="reset-btn">Update Password</button>
            </form>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        document.getElementById("reset-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById("new-password").value.trim();
            const btn = document.getElementById("reset-btn");
            
            btn.disabled = true;
            btn.textContent = "Updating...";

            const { error } = await _supabase.auth.updateUser({ password: newPassword });

            if (error) {
                alert(`❌ Error: ${error.message}`);
                btn.disabled = false;
                btn.textContent = "Update Password";
            } else {
                alert("✅ Password updated successfully! Redirecting to login...");
                window.location.href = "login.html";
            }
        });
    </script>
</body>
</html>
