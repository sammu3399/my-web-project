<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Win - Login</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Main Styles -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-body">

    <!-- Decorative background elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="login-container">
        <div class="panel login-panel">
            <div class="login-header">
                <h2 id="auth-title">Welcome Back</h2>
                <p id="auth-subtitle">Login to continue your streak 🔥</p>
            </div>
            
            <form id="login-form" class="login-form">
                <div class="input-group" id="username-group" style="display: none;">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Pick a cool username" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required autocomplete="email">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                
                <div class="auth-extras" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 13px;">
                    <a href="#" id="forgot-password" style="color: var(--accent); text-decoration: none;">Forgot Password?</a>
                    <span style="color: var(--text-muted);">
                        <a href="#" id="toggle-auth" style="color: var(--accent); font-weight: 600; text-decoration: none;">Create Account</a>
                    </span>
                </div>

                <button type="submit" class="login-btn" id="submit-btn">Start Winning</button>
            </form>
        </div>
    </div>

    <!-- JS -->
    <script src="supabase-config.js"></script>
    <script src="login.js"></script>
</body>
</html>
